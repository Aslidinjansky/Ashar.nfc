<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Ashar.nfc logo">
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#134a38" />
      <stop offset="55%" stop-color="#0c3b2c" />
      <stop offset="100%" stop-color="#08261e" />
    </radialGradient>
    <filter id="velvet" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="8" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <linearGradient id="silverGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f2f2" />
      <stop offset="50%" stop-color="#c7c7c7" />
      <stop offset="100%" stop-color="#9f9f9f" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a23a" />
      <stop offset="45%" stop-color="#f5d07a" />
      <stop offset="100%" stop-color="#b6791e" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35" />
    </filter>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="248" />
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <circle cx="256" cy="256" r="248" fill="url(#bgGradient)" filter="url(#velvet)" />
  </g>
  <path
    d="M256 92 L138 392 H192 L218 322 H294 L320 392 H374 L256 92 Z M256 170 L218 282 H294 Z"
    fill="url(#silverGradient)"
    fill-rule="evenodd"
    filter="url(#softShadow)"
  />

  <path
    d="M330 170 C292 120 212 132 212 192 C212 252 320 236 320 296 C320 358 228 362 188 320"
    fill="none"
    stroke="url(#goldGradient)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softShadow)"
  />

  <text
    x="256"
    y="430"
    fill="#d8b15c"
    font-family="'Playfair Display', 'Times New Roman', serif"
    font-size="44"
    letter-spacing="6"
    text-anchor="middle"
  >ASHAR</text>

  <g stroke="#d8b15c" stroke-width="2" stroke-linecap="round">
    <line x1="176" y1="456" x2="236" y2="456" />
    <line x1="276" y1="456" x2="336" y2="456" />
  </g>
  <circle cx="256" cy="456" r="4" fill="#d8b15c" />
</svg>
