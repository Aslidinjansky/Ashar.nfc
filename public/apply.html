<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply — Ashar.nfc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .apply-wrap { padding: 40px 24px 60px; background: radial-gradient(ellipse at 50% 0%, rgba(240,165,0,0.06) 0%, transparent 60%); min-height: 100vh; }
    .apply-header { text-align: center; margin-bottom: 32px; }
    .apply-logo { font-family: 'Playfair Display', serif; font-size: 26px; color: var(--accent-gold); font-weight: 700; text-decoration: none; display: inline-block; margin-bottom: 4px; }
    .apply-title { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .apply-sub { color: var(--text-secondary); font-size: 14px; line-height: 1.6; }
    .apply-form { display: flex; flex-direction: column; gap: 16px; }
    .apply-card { background: rgba(255,255,255,0.04); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 24px; }
    .success-screen { text-align: center; padding: 40px 0; }
    .success-icon { font-size: 64px; margin-bottom: 20px; }
    .success-title { font-family: 'Playfair Display', serif; font-size: 26px; margin-bottom: 12px; }
    .success-msg { color: var(--text-secondary); font-size: 15px; line-height: 1.7; margin-bottom: 28px; }
    .products-select-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .product-opt { border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px; cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.02); }
    .product-opt:hover { border-color: rgba(240,165,0,0.4); }
    .product-opt.selected { border-color: var(--accent-gold); background: rgba(240,165,0,0.06); }
    .product-opt input { display: none; }
    .product-opt-name { font-size: 12px; font-weight: 600; margin-top: 4px; }
    .product-opt-icon { font-size: 24px; }
    .back-link { color: var(--text-secondary); text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; }
    .back-link:hover { color: var(--text-primary); }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="apply-wrap">
    <a href="/" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Back to home
    </a>

    <div class="apply-header">
      <a href="/" class="apply-logo">ashar.nfc</a>
      <h1 class="apply-title">Get Your NFC Card</h1>
      <p class="apply-sub">Fill out the form below and our team will contact you within 24 hours.</p>
    </div>

    <div class="apply-card">
      <form class="apply-form" id="applyForm" onsubmit="submitApplication(event)">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" class="form-input" id="fullName" placeholder="Your full name" required>
        </div>
        <div class="form-group">
          <label>Phone Number *</label>
          <input type="tel" class="form-input" id="phone" placeholder="+992 XXX XXX XXX" required>
        </div>
        <div class="form-group">
          <label>Email Address *</label>
          <input type="email" class="form-input" id="email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label>WhatsApp Number</label>
          <input type="tel" class="form-input" id="whatsapp" placeholder="WhatsApp number (if different)">
        </div>
        <div class="form-group">
          <label>City</label>
          <input type="text" class="form-input" id="city" placeholder="Your city">
        </div>
        <div class="form-group">
          <label>Choose Your NFC Product *</label>
          <div class="products-select-grid" id="productGrid">
            <label class="product-opt" onclick="selectProduct('nfc_ring', this)">
              <input type="radio" name="product" value="nfc_ring">
              <div class="product-opt-icon">💍</div>
              <div class="product-opt-name">NFC Ring</div>
            </label>
            <label class="product-opt" onclick="selectProduct('metal_card', this)">
              <input type="radio" name="product" value="metal_card">
              <div class="product-opt-icon">💳</div>
              <div class="product-opt-name">Metal Card</div>
            </label>
            <label class="product-opt" onclick="selectProduct('plastic_card', this)">
              <input type="radio" name="product" value="plastic_card">
              <div class="product-opt-icon">🪪</div>
              <div class="product-opt-name">Plastic Card</div>
            </label>
            <label class="product-opt" onclick="selectProduct('phone_sticker', this)">
              <input type="radio" name="product" value="phone_sticker">
              <div class="product-opt-icon">📱</div>
              <div class="product-opt-name">Phone Sticker</div>
            </label>
            <label class="product-opt" onclick="selectProduct('smartphone_install', this)" style="grid-column:span 2;">
              <input type="radio" name="product" value="smartphone_install">
              <div class="product-opt-icon">📲</div>
              <div class="product-opt-name">Smartphone NFC Installation</div>
            </label>
          </div>
        </div>
        <div id="applyError" style="color:#ef4444;font-size:13px;display:none;"></div>
        <button type="submit" class="btn-gold" style="width:100%;justify-content:center;font-size:16px;padding:16px;">
          Submit Application
        </button>
      </form>

      <div id="successScreen" class="success-screen" style="display:none;">
        <div class="success-icon">🎉</div>
        <h2 class="success-title">Application Submitted!</h2>
        <p class="success-msg">Thank you! Our team will review your application and contact you within 24 hours via WhatsApp or email to complete your order.</p>
        <a href="https://wa.me/992752555222" target="_blank" rel="noopener"
           style="display:inline-flex;align-items:center;gap:10px;background:#25D366;color:#fff;font-weight:700;border-radius:50px;padding:14px 24px;text-decoration:none;font-size:15px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          Contact us on WhatsApp
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  let selectedProduct = '';

  function selectProduct(val, el) {
    selectedProduct = val;
    document.querySelectorAll('.product-opt').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
  }

  async function submitApplication(e) {
    e.preventDefault();
    const errEl = document.getElementById('applyError');
    errEl.style.display = 'none';

    if (!selectedProduct) {
      errEl.textContent = 'Please select a product.';
      errEl.style.display = 'block';
      return;
    }

    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = 'Submitting…';

    try {
      const res = await fetch('/api/applications', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          full_name: document.getElementById('fullName').value,
          phone: document.getElementById('phone').value,
          email: document.getElementById('email').value,
          whatsapp: document.getElementById('whatsapp').value,
          city: document.getElementById('city').value,
          nfc_product: selectedProduct
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Submission failed');

      document.getElementById('applyForm').style.display = 'none';
      document.getElementById('successScreen').style.display = 'block';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Submit Application';
    }
  }
</script>
</body>
</html>
