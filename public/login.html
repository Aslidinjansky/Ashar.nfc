<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Ashar.nfc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .login-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
      background: radial-gradient(ellipse at 50% 0%, rgba(240,165,0,0.07) 0%, transparent 60%);
    }
    .login-logo { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--accent-gold); font-weight: 700; margin-bottom: 4px; }
    .login-sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 32px; }
    .login-card { width: 100%; max-width: 360px; background: rgba(255,255,255,0.04); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 32px 24px; }
    .login-form { display: flex; flex-direction: column; gap: 16px; }
    .login-footer-links { margin-top: 20px; text-align: center; font-size: 13px; color: var(--text-secondary); }
    .login-footer-links a { color: var(--accent-gold); text-decoration: none; }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="login-wrap">
    <div class="login-logo">ashar.nfc</div>
    <div class="login-sub">Sign in to your account</div>

    <div class="login-card">
      <form class="login-form" id="loginForm" onsubmit="doLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-input" id="loginEmail" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-input" id="loginPassword" placeholder="Your password" required>
        </div>
        <div id="loginError" style="color:#ef4444;font-size:13px;display:none;"></div>
        <button type="submit" class="btn-gold" style="width:100%;justify-content:center;">
          Sign In
        </button>
      </form>

      <div class="login-footer-links">
        Don't have an account? <a href="/apply">Apply here</a>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script>
  if (localStorage.getItem('token')) window.location.href = '/dashboard';

  async function doLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';

    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = '/dashboard';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  }
</script>
</body>
</html>
